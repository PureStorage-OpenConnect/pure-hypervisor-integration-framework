# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket to the backend (which itself serves HTTPS).
    location /api/ {
        proxy_pass https://backend:8000;
        proxy_ssl_verify off;            # backend uses the same self-signed cert
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        client_max_body_size 600m;       # allow large image tar uploads
    }

    location /healthz {
        proxy_pass https://backend:8000;
        proxy_ssl_verify off;
    }
}
