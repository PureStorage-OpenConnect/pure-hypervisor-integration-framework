# Toolchain versions matching morpheus-plugin-core rel-2.10.0 (morpheus-plugin-api 1.2.x).
groovyVersion=3.0.9
slf4jVersion=1.7.26
# morpheus-plugin-api. Bumped 1.2.9 -> 1.3.4 to get
# DatastoreTypeProvider.SnapshotFacet.SnapshotInstanceFacet (added in 1.3.0), which is
# the facet VME's MVM instance-snapshot create/revert/DELETE actually routes through.
# The 8.1.0 appliance runtime provides these classes.
morpheusApiVersion=1.3.4
# Karman (cloud-file lib) version Morpheus builds against; provides
# CloudFileInterface referenced by DatastoreTypeProvider.cloneVolume.
karmanVersion=2.0.5
# Build-time plugins that bundle + register the provider icon (src/assets/images
# -> assets/ in the JAR, served at /assets/plugin/<slug>/...). Versions per the
# HewlettPackard/morpheus-plugin-samples (morpheus-generic-integration-plugin).
assetPipelineVersion=4.4.0
morpheusGradleVersion=1.1.5
org.gradle.jvmargs=-Xmx2g -Xms2g
