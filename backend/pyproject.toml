[project]
name = "phif"
version = "0.1.0"
description = "Everpure Data Hypervisor Integration Framework"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "asyncssh>=2.14",
    "ansible-runner>=2.3",
    "py-pure-client>=1.57",
    "python-multipart>=0.0.9",
    "docker>=7.0",
    "pyvmomi>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phif*"]

[tool.setuptools.package-data]
# Ship connector-bundled artifacts (storage-driver plugins, manifests) in wheels.
"phif" = ["connectors/**/files/*", "connectors/**/*.pm", "connectors/**/*.yaml", "connectors/**/*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
