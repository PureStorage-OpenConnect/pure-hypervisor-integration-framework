{{- /*
Vault master key. Precedence:
  1. .Values.vaultMasterKey, when set explicitly.
  2. The key already stored in this Secret in the cluster.
  3. A newly generated key — first install only.

Step 2 is what makes `helm upgrade` safe. Previously this template re-evaluated
randAlphaNum on every render, so any upgrade with vaultMasterKey unset rotated
the key and left every array token in the database permanently undecryptable.

CAVEAT: `lookup` returns nothing when there is no cluster connection, so
`helm template` and `helm upgrade --dry-run` show a NEWLY generated key for an
existing release. That output is for inspection only — never pipe it into
`kubectl apply`, or you will rotate the key this logic exists to preserve.
*/ -}}
{{- $name := printf "%s-vault" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prior := "" -}}
{{- if $existing -}}
  {{- /* Values read back via lookup live in .data and are base64-encoded. */ -}}
  {{- $prior = index (default dict $existing.data) "vault-master-key" | default "" -}}
{{- end -}}
{{- $key := "" -}}
{{- if .Values.vaultMasterKey -}}
  {{- $key = .Values.vaultMasterKey -}}
{{- else if $prior -}}
  {{- $key = b64dec $prior -}}
{{- else -}}
  {{- $key = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  vault-master-key: {{ $key | quote }}
